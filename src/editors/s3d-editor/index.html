<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hero Engine 3D 場景編輯器</title>
    <!-- editor-theme -->
    <style>
      /* 共用的色票、按鈕、輸入框、面板標題…在 shared/theme.css（開發伺服器放在上面）；這裡只放 3D 場景編輯器自己的 */

      /* ───────── 頂部工具列 ───────── */
      /* 兩排：第一排是檔案與執行，第二排是編輯工具與顯示開關 */
      header { display: flex; flex-direction: column; padding: 7px 14px; }
      /* 工具列太長時在那一排裡捲動，不要把整個頁面撐寬（右邊的屬性面板會被擠出畫面） */
      header #fileSelect { min-width: 160px; }
      header .doc-name { flex-shrink: 1; min-width: 80px; }
      select { min-width: 180px; }
      select.project-select { min-width: 120px; font-weight: 600; color: var(--accent-hi); }

      /* ───────── 三欄 ───────── */
      main { display: grid; grid-template-columns: 260px minmax(0, 1fr) 300px; min-height: 0; }
      .add-menu { min-width: 0; width: 40px; padding: 2px 6px; text-align: center; font-weight: 700; color: var(--accent); }

      /* 階層 */
      #tree { position: relative; }
      #tree.drop-root { box-shadow: inset 0 0 0 2px var(--accent-a40); }
      .tree-row { display: flex; align-items: center; gap: 5px; padding: 3px 8px; border-radius: var(--radius-sm); cursor: default; white-space: nowrap; position: relative; }
      .tree-row:hover { background: var(--raise); }
      .tree-row.selected { background: var(--accent-a15); color: var(--accent-hi); }
      .tree-row.dragging { opacity: 0.4; }
      .tree-row.drop-inside { box-shadow: inset 0 0 0 1px var(--accent); }
      .tree-row.drop-before::before, .tree-row.drop-after::after { content: ""; position: absolute; left: 6px; right: 6px; height: 2px; background: var(--accent); }
      .tree-row.drop-before::before { top: -1px; }
      .tree-row.drop-after::after { bottom: -1px; }
      .twisty { width: 12px; height: 12px; flex: none; cursor: pointer; position: relative; }
      .twisty::before { content: ""; position: absolute; border: 0 solid transparent; }
      .twisty.open::before { left: 2px; top: 4px; border-width: 5px 4px 0; border-top-color: var(--muted); }
      .twisty.closed::before { left: 4px; top: 2px; border-width: 4px 0 4px 5px; border-left-color: var(--muted); }
      .tree-icon { width: 16px; flex: none; text-align: center; font-size: 11px; color: var(--muted); }
      .tree-name { overflow: hidden; text-overflow: ellipsis; }
      .tree-name.unnamed { color: var(--muted); font-style: italic; }
      .tree-row .id { color: var(--muted); font: 11px var(--mono); margin-left: auto; padding-left: 8px; }
      .tree-rename { flex: 1; min-width: 0; padding: 1px 6px; }

      /* 素材 */
      .assets-head { border-top: 1px solid var(--line); }
      #tree { flex: 3; }
      #assets { flex: 2; }
      .asset-filter { flex: 1; min-width: 0; padding: 2px 8px; font-size: 12px; }
      .asset-group { color: var(--muted); font-size: 11px; font-weight: 650; letter-spacing: 0.06em; padding: 8px 8px 2px; }
      .asset-row { display: flex; align-items: center; gap: 8px; padding: 3px 8px; border-radius: var(--radius-sm); cursor: grab; white-space: nowrap; }
      .asset-row:hover { background: var(--raise); }
      .asset-icon { width: 22px; text-align: center; color: var(--muted); }
      .asset-thumb { width: 22px; height: 22px; object-fit: cover; border-radius: 4px; background: var(--bg); image-rendering: pixelated; }
      .asset-name { overflow: hidden; text-overflow: ellipsis; font-size: 12.5px; }
      #viewport.drop { box-shadow: inset 0 0 0 3px var(--accent); }
      .tree-row.prefab .tree-name { color: #8ecae6; }
      .tree-row.inner { opacity: 0.75; }
      .tree-row.inner .tree-name { font-style: italic; color: var(--text2); }
      .tree-row.selected:not(.primary) { background: rgba(154, 205, 50, 0.08); }
      .comp h3.overridden > span:first-child::after { content: " ●"; color: #8ecae6; }
      .settings-sub { margin: 10px 0 2px; color: var(--muted); font-size: 11px; font-weight: 650; letter-spacing: 0.06em; }
      .settings-actions { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
      /* 腳本（ScriptList）：每個腳本一塊 */
      .script-card { border: 1px solid var(--line); border-radius: var(--radius-sm); padding: 6px 8px; margin-bottom: 8px; background: var(--panel2); }
      .script-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 4px; font-family: var(--mono); color: var(--accent-hi); }
      .ui-file { display: flex; align-items: center; gap: 4px; margin-top: 6px; }
      .ui-file-name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font: 12px var(--mono); color: var(--text2); }
      .ui-file-add { width: 100%; margin-top: 8px; padding: 3px 7px; }
      .section-toggle { margin-left: auto; display: inline-flex; align-items: center; gap: 4px; font-weight: 500; font-size: 12px; }
      .small-btn.on { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
      .insp-many { padding: 6px 4px; }
      .insp-many-title { font-weight: 650; margin-bottom: 6px; }
      .insp-many-row { font-size: 12.5px; color: var(--text2); padding: 2px 0; }
      #viewport.painting canvas { cursor: crosshair; }
      .tree-row.prefab.selected .tree-name { color: var(--accent-hi); }
      .doc-name.prefab { color: #8ecae6; border-color: rgba(142, 202, 230, 0.35); }
      #backBtn { font-size: 12px; padding: 3px 10px; }

      /* 試玩 */
      .play-btn.on { background: var(--error); border-color: var(--error); color: #1a0a0a; }
      body.playing aside, body.playing .bar-row > :not(#playBtn):not(.spacer):not(.brand) { pointer-events: none; opacity: 0.45; }
      body.playing #viewport { box-shadow: inset 0 0 0 2px var(--error); }
      /* 預覽：在畫面區域裡跑真正的遊戲頁面 */
      #preview { position: absolute; inset: 0; z-index: 20; display: flex; flex-direction: column; background: #000; }
      #preview[hidden] { display: none; }
      /* ───────── 階層滑鼠提示：畫面上物件的名稱標籤 ───────── */
      .hover-tip { position: absolute; z-index: 25; pointer-events: none; max-width: 280px; padding: 5px 9px;
        background: rgba(24, 32, 38, 0.92); border: 1px solid #5ec8ff; border-radius: var(--radius-sm);
        box-shadow: 0 6px 18px rgba(0, 0, 0, 0.45); font-size: 12px; line-height: 1.4; }
      .hover-tip[hidden] { display: none; }
      .hover-tip b { color: #bfe9ff; font-weight: 650; }
      .hover-tip-id { margin-left: 8px; font: 11px var(--mono); color: var(--muted); }
      .hover-tip-detail { color: var(--text2); font-size: 11.5px; margin-top: 1px; }
      /* ───────── 素材預覽小視窗（素材面板雙擊） ───────── */
      .asset-win { position: absolute; top: 12px; right: 12px; z-index: 30; width: 440px; height: 380px; min-width: 280px; min-height: 220px;
        max-width: calc(100% - 24px); max-height: calc(100% - 24px); display: flex; flex-direction: column; resize: both; overflow: hidden;
        background: var(--panel); border: 1px solid var(--line-hi); border-radius: var(--radius); box-shadow: var(--shadow-lg); }
      .asset-win[hidden] { display: none; }
      /* 全畫面：填滿整個頁面（拖曳、改大小沒有作用） */
      .asset-win.full { position: fixed; inset: 0 !important; z-index: 100; width: auto !important; height: auto !important;
        max-width: none; max-height: none; border: 0; border-radius: 0; resize: none; }
      .asset-win.full .asset-win-head { cursor: default; }
      .asset-win.full .asset-win-hl, .asset-win.full .asset-win-text { font-size: 13.5px; }
      .asset-win-head { display: flex; align-items: center; gap: 6px; padding: 6px 8px 6px 12px; background: var(--panel2);
        border-bottom: 1px solid var(--line); cursor: move; user-select: none; }
      .asset-win-title { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font: 12px var(--mono); color: var(--text2); }
      .asset-win-title b { font-family: system-ui, sans-serif; color: var(--accent); font-weight: 650; margin-right: 4px; }
      .asset-win-body { flex: 1; min-height: 0; position: relative; overflow: auto; background: var(--bg); }
      .asset-win-foot { display: flex; align-items: center; gap: 6px; padding: 6px 8px 6px 12px; border-top: 1px solid var(--line); background: var(--panel2); }
      .asset-win-info { flex: 1; min-width: 0; color: var(--muted); font-size: 11.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .asset-win-msg { padding: 16px; color: var(--muted); }
      .asset-win-msg.error { color: var(--error); }
      .asset-win-checker { position: absolute; inset: 0; display: grid; place-items: center; padding: 10px;
        background: repeating-conic-gradient(#262a24 0% 25%, #1f221e 0% 50%) 50% / 16px 16px; }
      .asset-win-img { max-width: 100%; max-height: 100%; object-fit: contain; image-rendering: auto; }
      .asset-win-center { position: absolute; inset: 0; display: grid; place-items: center; padding: 16px; }
      .asset-win-center audio { width: 100%; }
      /* 可以編輯的原始碼：上色的底層（.asset-win-hl）+ 透明文字的輸入框疊在一起 */
      .asset-win-editor { position: absolute; inset: 0; overflow: hidden; }
      .asset-win-hl, .asset-win-text { margin: 0; padding: 10px 12px; border: 0; font: 11.5px/1.55 var(--mono); tab-size: 2; white-space: pre; letter-spacing: 0; }
      .asset-win-hl { position: absolute; inset: 0; overflow: hidden; pointer-events: none; color: var(--text2); }
      .asset-win-hl > code { display: block; font: inherit; will-change: transform; }
      .asset-win-text { position: relative; z-index: 1; display: block; width: 100%; height: 100%; resize: none; outline: none;
        background: transparent; color: var(--text2); caret-color: var(--accent-hi); overflow: auto; }
      .asset-win-editor.xml .asset-win-text { color: transparent; }
      .asset-win-editor:not(.xml) .asset-win-hl { display: none; }
      .asset-win-text::selection { background: var(--accent-a25, rgba(154,205,50,.25)); }
      .asset-win-info.error { color: var(--error); }
      .asset-win-code { margin: 0; padding: 10px 12px; font: 11.5px/1.55 var(--mono); color: var(--text2); white-space: pre; tab-size: 2; }
      .asset-win-3d { position: absolute; inset: 0; background: radial-gradient(ellipse at 50% 40%, #2d322a 0%, #181a18 75%); }
      .asset-win-canvas { display: block; width: 100%; height: 100%; cursor: grab; touch-action: none; }
      .asset-win-canvas:active { cursor: grabbing; }
      .asset-win-clip { position: absolute; left: 8px; top: 8px; max-width: calc(100% - 16px); }
      /* XML 上色（和 UI 編輯器一樣） */
      .hl-c { color: #6a7363; font-style: italic; } .hl-p { color: #78816f; } .hl-t { color: #c3a6ff; } .hl-tu { color: #a8d94a; }
      .hl-a { color: #f0cf7a; } .hl-bp { color: #ffa65c; } .hl-ev { color: #ff85b8; } .hl-s { color: #7fd6c2; }
      .hl-b { color: #ffe066; font-weight: 600; } .hl-e { color: #e5a66b; } .hl-x { color: var(--text); } .hl-d { color: #6a7363; }
      .preview-bar { display: flex; align-items: center; gap: 6px; padding: 6px 10px; background: var(--panel2); border-bottom: 1px solid var(--line); }
      .preview-bar .preview-title { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--text2); font-size: 12px; }
      .preview-bar .preview-title b { color: var(--accent); font-weight: 650; }
      #previewFrame { flex: 1; width: 100%; border: 0; background: #000; }
      body.previewing #playBtn { pointer-events: none; opacity: 0.45; }
      #previewBtn.on { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }

      /* 畫面 */
      #viewport { position: relative; min-width: 0; min-height: 0; overflow: hidden; }
      #viewport canvas { display: block; }
      #status { position: absolute; left: 12px; bottom: 10px; padding: 4px 10px; border-radius: 999px; font-size: 12px;
        background: rgba(24,26,24,0.8); border: 1px solid var(--line); color: var(--text2); pointer-events: none; }
      #status:empty { display: none; }
      #status.error { color: var(--error); border-color: var(--error); }
      #status.warn { color: var(--warn); border-color: var(--warn); }

      /* 屬性 */
      .insp-head { padding: 4px 4px 8px; }
      .insp-id { font: 12px var(--mono); color: var(--muted); }
      .comp { border: 1px solid var(--line); border-radius: var(--radius); background: var(--panel2); margin: 6px 4px; }
      .comp h3 { display: flex; align-items: center; gap: 6px; margin: 0; padding: 5px 6px 5px 10px; font-size: 12px; font-weight: 650; color: var(--text2); border-bottom: 1px solid var(--line); }
      .comp h3 .comp-name { color: var(--muted); font: 400 11px var(--mono); margin-right: auto; }
      .comp-body { padding: 6px 8px 8px; }
      .comp-note { color: var(--muted); font-size: 12px; margin-bottom: 6px; }
      .insp-add { width: calc(100% - 8px); margin: 8px 4px; }
      .insp-prefab { display: flex; align-items: center; gap: 6px; margin: 6px 0 2px; padding: 6px 8px; border-radius: var(--radius-sm);
        background: rgba(142, 202, 230, 0.08); border: 1px solid rgba(142, 202, 230, 0.25); }
      .insp-prefab-path { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; font: 12px var(--mono); color: #8ecae6; }
      .insp-actions { display: flex; justify-content: flex-end; margin-top: 4px; }
      .small-btn { font-size: 12px; padding: 2px 9px; }
      .f-check3 { display: flex; gap: 12px; }
      .f-range { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px; }
      .f-check3 .f-check { display: inline-flex; align-items: center; gap: 4px; font: 700 11px var(--mono); color: var(--muted); }
      .f-text-wrap { display: contents; }

      /* 欄位 */
      .f-row { display: grid; grid-template-columns: 78px minmax(0, 1fr); align-items: center; gap: 8px; min-height: 28px; }
      .f-row[hidden] { display: none; }
      .f-label { color: var(--text2); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .f-label[title] { text-decoration: underline dotted var(--muted); text-underline-offset: 3px; cursor: help; }
      .f-row input, .f-row select { padding: 3px 7px; min-width: 0; width: 100%; }
      .f-vec3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px; }
      .f-num { position: relative; display: flex; align-items: center; min-width: 0; }
      .f-num input { cursor: ew-resize; font-variant-numeric: tabular-nums; }
      .f-num input:focus { cursor: text; }
      .f-num.dragging input { border-color: var(--accent); }
      .f-tag { position: absolute; left: 6px; font: 700 10px var(--mono); pointer-events: none; color: var(--muted); }
      .f-tag + input { padding-left: 18px; }
      .f-tag.x { color: #ff7b72; } .f-tag.y { color: #9acd32; } .f-tag.z { color: #79b8ff; }
      .f-color { display: flex; gap: 6px; }
      .f-color input[type="color"] { width: 34px; flex: none; padding: 1px 2px; height: 26px; cursor: pointer; }
      .f-hex { font-family: var(--mono); }
      .f-check input { width: auto; accent-color: var(--accent); }
      .f-json { width: 100%; min-height: 60px; resize: vertical; font: 11.5px/1.5 var(--mono); color: var(--text); background: var(--bg);
        border: 1px solid var(--line); border-radius: var(--radius-sm); padding: 6px 8px; }
      .f-json:focus { outline: none; border-color: var(--accent-lo); }
      .f-json.error { border-color: var(--error); }
    </style>
  </head>
  <body>
    <header>
      <!-- 第一排：專案、檔案、預覽／試玩、儲存 -->
      <div class="bar-row">
        <div class="brand"><div class="logo">3D</div><h1>3D 場景編輯器</h1></div>
        <nav class="editor-nav" aria-label="編輯器">
          <a href="/portal.html" target="hero-portal" title="專案入口頁：切換、新增、刪除專案（另一個分頁）">專案</a>
          <a href="/ui-editor.html" target="hero-ui-editor" title="UI 編輯器（另一個分頁）">UI</a>
          <a href="/s3d-editor.html" aria-current="page">3D 場景</a>
          <a href="/shader-editor.html" target="hero-shader-editor" title="著色器編輯器（另一個分頁）">著色器</a>
          <a href="/se-editor.html" target="hero-se-editor" title="音效編輯器（另一個分頁）">音效</a>
        </nav>
        <div class="divider"></div>
        <select id="projectSelect" class="project-select" title="要編輯的遊戲專案（projects/ 裡的資料夾）：切換後開發伺服器會換成那個專案並重新整理"></select>
        <select id="fileSelect" title="public/scenes 裡的場景檔"></select>
        <button id="newBtn">新增場景</button>
        <button id="reloadBtn" title="重新讀取檔案（放棄沒存的修改）">重新讀取</button>
        <span class="doc-name" id="docName">尚未開啟</span>
        <button id="backBtn" hidden></button>
        <div class="spacer"></div>
        <button id="previewBtn" title="預覽：在這裡執行真正的遊戲（遊戲程式、介面、腳本都會跑），直接進入這個場景；還沒存檔的修改也會即時套用" disabled>👁 預覽</button>
        <button id="playBtn" class="play-btn" title="試玩：物理會動、從場景的攝影機看；停止後回到編輯前的狀態（Cmd/Ctrl+P）" disabled>▶ 試玩</button>
        <div class="divider"></div>
        <button id="saveBtn" class="primary" disabled title="儲存（Cmd/Ctrl+S）">儲存</button>
      </div>
      <!-- 第二排：編輯工具、顯示開關 -->
      <div class="bar-row">
        <button id="undoBtn" disabled>復原</button>
        <button id="redoBtn" disabled>重做</button>
        <div class="divider"></div>
        <div class="group">
          <button data-gizmo="translate" class="on" title="移動（W）">移動</button>
          <button data-gizmo="rotate" title="旋轉（E）">旋轉</button>
          <button data-gizmo="scale" title="縮放（R）">縮放</button>
        </div>
        <button id="spaceBtn" data-space="world" title="控制器用世界座標或物件自己的座標（Q）">世界</button>
        <button id="snapBtn" title="對齊：移動 0.25、旋轉 15 度、縮放 0.1">對齊</button>
        <div class="spacer"></div>
        <span class="bar-label">顯示</span>
        <button id="gridBtn" class="on" title="顯示格線">格線</button>
        <button id="colliderBtn" class="on" title="顯示碰撞體的形狀（藍色線框）">碰撞體</button>
        <button id="uiBtn" class="on" title="顯示／隱藏場景搭配的介面（UI 層，只顯示不能點；U 鍵切換）；要換哪些介面檔：不選物件，在屬性面板的「介面（UI 層）」設定">UI 層</button>
        <div class="divider"></div>
        <button id="uiEditBtn" title="在 UI 編輯器打開這個場景的介面（另一個分頁），修改會即時顯示在 UI 層">編輯 UI ↗</button>
      </div>
    </header>
    <main>
      <aside class="left">
        <div class="panel-head">
          <span class="title">階層</span>
          <div class="spacer"></div>
          <select id="addMenu" class="add-menu" title="加入物件"><option value="" selected disabled>＋</option></select>
          <button id="dupBtn" class="icon-btn" title="複製（Cmd/Ctrl+D）" disabled>⧉</button>
          <button id="delBtn" class="icon-btn" title="刪除（Delete）" disabled>✕</button>
        </div>
        <div class="panel-body" id="tree"></div>
        <div class="panel-head assets-head">
          <span class="title">素材</span>
          <input id="assetFilter" class="asset-filter" type="search" placeholder="搜尋" />
          <button id="assetRefresh" class="icon-btn" title="重新讀取素材清單">↻</button>
        </div>
        <div class="panel-body" id="assets"></div>
      </aside>
      <section id="viewport">
        <div id="status"></div>
        <div id="preview" hidden>
          <div class="preview-bar">
            <span class="preview-title" id="previewTitle"></span>
            <button id="previewRestart" class="small-btn" title="重新載入遊戲頁面">↻ 重新開始</button>
            <button id="previewTab" class="small-btn" title="在新分頁開啟（全螢幕看；修改一樣會即時套用）">新分頁 ↗</button>
            <button id="previewClose" class="small-btn" title="關閉預覽，回到編輯畫面">✕ 關閉</button>
          </div>
          <iframe id="previewFrame" title="遊戲預覽" allow="autoplay; fullscreen; gamepad"></iframe>
        </div>
      </section>
      <aside class="right">
        <div class="panel-head"><span class="title">屬性</span></div>
        <div class="panel-body" id="props"></div>
      </aside>
    </main>
    <script type="module" src="./editor.ts"></script>
  </body>
</html>
